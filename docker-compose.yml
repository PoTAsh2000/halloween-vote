services:
  halloween-vote:
    build: .
    image: halloween-vote:latest
    container_name: halloween-vote
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      - halloween-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: halloween-vote-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - halloween-vote

volumes:
  halloween-data:
