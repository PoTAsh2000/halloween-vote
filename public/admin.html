<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Outfit Awards Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card wide">
    <h1>Outfit Awards Admin</h1>

    <form id="login" class="stack" hidden>
      <label for="code">Admin code</label>
      <input id="code" maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" title="6 cijfers" required>
      <button type="submit">Inloggen</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>

    <section id="dashboard" class="stack" hidden>
      <div class="summary">
        <span id="state" class="pill"></span>
        <span id="progress" class="muted"></span>
      </div>

      <p id="dry-run" class="notice" hidden>
        SMS_GATEWAY_URL is niet ingesteld: berichten komen alleen in de serverlog, er gaat geen echte SMS uit.
      </p>

      <div id="winner" class="winner" hidden>
        <p id="winner-label" class="label"></p>
        <p id="winner-names" class="names"></p>
        <p id="winner-votes" class="muted"></p>
      </div>

      <form id="add" class="add-form">
        <input id="name" placeholder="Naam" maxlength="40" aria-label="Naam" required>
        <input id="phone" placeholder="06 12345678" inputmode="tel" aria-label="Telefoonnummer" required>
        <button type="submit">Toevoegen</button>
      </form>

      <div class="actions">
        <button id="send-all" type="button">Verstuur toegang</button>
        <button id="close" type="button" class="danger">Sluit stemming</button>
      </div>
      <p id="message" class="status" role="status"></p>

      <ul id="guests" class="guests"></ul>
      <p id="empty" class="muted" hidden>Nog geen gasten. Voeg ze hierboven toe.</p>
      <p class="muted">Tip: je staat zelf al op de lijst als admin, dus je kunt ook stemmen en op je stemmen.</p>
      <button id="logout" type="button" class="link">Uitloggen</button>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let data = { closed: false, users: [] };
    let sending = false;

    function show(id) {
      for (const section of ['login', 'dashboard']) $(section).hidden = section !== id;
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = await res.json().catch(() => ({}));
      return { status: res.status, ok: res.ok, data: json };
    }

    function say(text, isError = false) {
      $('message').className = isError ? 'status error' : 'status';
      $('message').textContent = text;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      const { closed, users } = data;
      const voted = users.filter((u) => u.has_voted).length;
      const unsent = users.filter((u) => !u.is_admin && !u.sms_sent_at).length;

      $('state').textContent = closed ? 'Stemming gesloten' : 'Stemming open';
      $('state').className = closed ? 'pill closed' : 'pill';
      $('progress').textContent = `${voted} van ${users.length} gestemd`;
      $('dry-run').hidden = !data.smsDryRun;
      $('add').hidden = closed;
      $('send-all').hidden = closed;
      $('close').hidden = closed;
      $('send-all').disabled = sending || unsent === 0;
      $('send-all').textContent = sending ? 'Versturen...'
        : unsent ? `Verstuur toegang (${unsent})` : 'Iedereen heeft een SMS';
      $('close').disabled = users.length === 0;
      $('empty').hidden = users.length > 0;

      $('guests').replaceChildren(...users.map((u) => {
        const main = el('div', 'guest-main');
        main.append(el('strong', '', u.name), el('span', '', u.phone));

        const meta = el('div', 'guest-meta');
        meta.append(el('code', '', u.access_code));
        if (u.is_admin) meta.append(el('span', 'badge ok', 'admin'));
        else meta.append(el('span', u.sms_sent_at ? 'badge ok' : 'badge', u.sms_sent_at ? `SMS ${formatTime(u.sms_sent_at)}` : 'geen SMS'));
        meta.append(el('span', u.has_voted ? 'badge ok' : 'badge', u.has_voted ? 'gestemd' : 'niet gestemd'));

        // The admin code is fixed and the admin cannot be removed, so no buttons.
        const actions = el('div', 'guest-actions');
        if (!u.is_admin) {
          if (!closed) {
            const resend = el('button', 'small ghost', 'Opnieuw sturen');
            resend.type = 'button';
            resend.onclick = () => resendAccess(u, resend);
            actions.append(resend);
          }
          const remove = el('button', 'small danger', 'Verwijder');
          remove.type = 'button';
          remove.onclick = () => removeGuest(u);
          actions.append(remove);
        }

        const li = el('li', 'guest');
        li.append(main, meta, actions);
        return li;
      }));
    }

    async function renderWinner() {
      const { ok, data: result } = await api('GET', '/api/admin/winner');
      if (!ok) return;
      const winners = result.winners;
      $('winner').hidden = false;
      if (winners.length === 0) {
        $('winner-label').textContent = 'Uitslag';
        $('winner-names').textContent = 'Niemand heeft gestemd';
        $('winner-votes').textContent = '';
        return;
      }
      const votes = winners[0].votes;
      const names = winners.map((w) => w.name);
      $('winner-label').textContent = winners.length === 1 ? 'Winnaar' : 'Gedeelde winnaars';
      $('winner-names').textContent = names.length === 1 ? names[0]
        : `${names.slice(0, -1).join(', ')} en ${names.at(-1)}`;
      $('winner-votes').textContent = `${votes} ${votes === 1 ? 'stem' : 'stemmen'}${winners.length > 1 ? ' elk' : ''}`;
    }

    async function load() {
      const { status, data: result } = await api('GET', '/api/admin/users');
      if (status === 401) return show('login');
      if (status !== 200) return;
      data = result;
      render();
      show('dashboard');
      if (data.closed) renderWinner();
    }

    async function resendAccess(user, button) {
      if (!confirm(`Nieuwe code maken en opnieuw sturen naar ${user.name}? De oude code werkt dan niet meer.`)) return;
      button.disabled = true;
      const { ok, data: result } = await api('POST', `/api/admin/users/${user.guid}/resend`);
      say(ok ? `Nieuwe code verstuurd naar ${user.name}.` : result.error ?? 'Opnieuw sturen mislukt.', !ok);
      load();
    }

    async function removeGuest(user) {
      if (!confirm(`${user.name} verwijderen? Stemmen op ${user.name} vervallen.`)) return;
      const { ok, data: result } = await api('DELETE', `/api/admin/users/${user.guid}`);
      say(ok ? `${user.name} verwijderd.` : result.error ?? 'Verwijderen mislukt.', !ok);
      load();
    }

    // Codes are exactly 6 digits: drop anything else while typing.
    $('code').oninput = () => { $('code').value = $('code').value.replace(/\D/g, '').slice(0, 6); };

    $('login').onsubmit = async (event) => {
      event.preventDefault();
      $('login-error').textContent = '';
      if (!/^\d{6}$/.test($('code').value)) {
        $('login-error').textContent = 'Een code bestaat uit 6 cijfers.';
        return;
      }
      const { ok, data: result } = await api('POST', '/api/admin/login', { code: $('code').value });
      if (!ok) {
        $('login-error').textContent = result.error ?? 'Inloggen mislukt.';
        return;
      }
      $('code').value = '';
      load();
    };

    $('add').onsubmit = async (event) => {
      event.preventDefault();
      const { ok, data: result } = await api('POST', '/api/admin/users', { name: $('name').value, phone: $('phone').value });
      if (!ok) return say(result.error ?? 'Toevoegen mislukt.', true);
      say(`${result.name} toegevoegd.`);
      $('add').reset();
      $('name').focus();
      load();
    };

    $('send-all').onclick = async () => {
      const unsent = data.users.filter((u) => !u.is_admin && !u.sms_sent_at).length;
      if (!confirm(`Toegangscode en link versturen naar ${unsent} ${unsent === 1 ? 'gast' : 'gasten'}?`)) return;
      sending = true;
      render();
      const { ok, data: result } = await api('POST', '/api/admin/send-access');
      sending = false;
      if (!ok) say(result.error ?? 'Versturen mislukt.', true);
      else if (result.failed.length) {
        say(`${result.sent} verstuurd, mislukt: ${result.failed.map((f) => `${f.name} (${f.error})`).join('; ')}`, true);
      } else say(`${result.sent} SMS verstuurd.`);
      load();
    };

    $('close').onclick = async () => {
      const notVoted = data.users.filter((u) => !u.has_voted).length;
      const warning = notVoted ? `\n\nLet op: ${notVoted} ${notVoted === 1 ? 'gast heeft' : 'gasten hebben'} nog niet gestemd.` : '';
      if (!confirm(`Stemming sluiten? Daarna kan niemand meer stemmen of inloggen. Dit kun je niet terugdraaien.${warning}`)) return;
      const { ok, data: result } = await api('POST', '/api/admin/close');
      say(ok ? 'Stemming gesloten.' : result.error ?? 'Sluiten mislukt.', !ok);
      load();
    };

    $('logout').onclick = async () => {
      await api('POST', '/api/logout');
      show('login');
    };

    // Keep the "gestemd" badges live while guests vote.
    setInterval(() => {
      if (!document.hidden && !$('dashboard').hidden && !sending) load();
    }, 10_000);

    load();
  </script>
</body>
</html>
